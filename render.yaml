services:
  - type: web
    name: wordle-entropy-ai
    runtime: static
    buildCommand: mkdir -p dist && cp index.html style.css app.js solver.worker.js answers.txt eng_dict.txt dist/
    staticPublishPath: dist
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; worker-src 'self'; style-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"
